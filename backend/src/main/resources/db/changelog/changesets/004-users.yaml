databaseChangeLog:
  - changeSet:
      id: 004-create-users-table
      author: hrms-team
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(200)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: employee_id
                  type: varchar(50)
                  constraints:
                    unique: true
              - column:
                  name: department
                  type: varchar(100)
              - column:
                  name: team
                  type: varchar(100)
              - column:
                  name: phone
                  type: varchar(20)
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: last_login_at
                  type: datetime
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: bigint
              - column:
                  name: updated_at
                  type: datetime
              - column:
                  name: updated_by
                  type: bigint
