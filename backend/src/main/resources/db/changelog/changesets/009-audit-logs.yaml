databaseChangeLog:
  - changeSet:
      id: 009-create-audit-logs-table
      author: hrms-team
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_audit_log_user
                    references: users(id)
              - column:
                  name: action_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: module
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: entity_type
                  type: varchar(100)
              - column:
                  name: entity_id
                  type: bigint
              - column:
                  name: old_value
                  type: text
              - column:
                  name: new_value
                  type: text
              - column:
                  name: ip_address
                  type: varchar(45)
              - column:
                  name: user_agent
                  type: varchar(500)
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: bigint
              - column:
                  name: updated_at
                  type: datetime
              - column:
                  name: updated_by
                  type: bigint

        - createIndex:
            tableName: audit_logs
            indexName: idx_audit_logs_module
            columns:
              - column:
                  name: module
              - column:
                  name: created_at

        - createIndex:
            tableName: audit_logs
            indexName: idx_audit_logs_user
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at
