databaseChangeLog:
  - changeSet:
      id: 006-create-workflow-tables
      author: hrms-team
      changes:
        - createTable:
            tableName: workflow_master
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: is_published
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: is_default
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: bigint
              - column:
                  name: updated_at
                  type: datetime
              - column:
                  name: updated_by
                  type: bigint

        - createTable:
            tableName: workflow_stage
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: workflow_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workflow_stage_workflow
                    references: workflow_master(id)
              - column:
                  name: stage_code
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: stage_name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: sequence_order
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: is_terminal
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: bigint
              - column:
                  name: updated_at
                  type: datetime
              - column:
                  name: updated_by
                  type: bigint

        - createTable:
            tableName: workflow_transition
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: from_stage_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workflow_transition_from
                    references: workflow_stage(id)
              - column:
                  name: to_stage_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workflow_transition_to
                    references: workflow_stage(id)
              - column:
                  name: required_permission_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_workflow_transition_permission
                    references: permissions(id)
              - column:
                  name: mandatory_comment
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: requires_approval
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: bigint
              - column:
                  name: updated_at
                  type: datetime
              - column:
                  name: updated_by
                  type: bigint
